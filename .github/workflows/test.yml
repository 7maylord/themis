name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither
        # Task 13 Step 1 — every High/Medium finding as of this pass has been
        # triaged (fixed, or documented inline with slither-disable-next-line +
        # a WHY comment). --fail-medium keeps this a real gate against new
        # ones, without blocking on the already-reviewed Low/Informational set.
        run: slither src/ --config-file lib/v4-hooks-public/slither.config.json --fail-medium

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        # Excludes *.fork.t.sol — those need a real MAINNET_RPC_URL and hit live
        # mainnet state, so they're run manually/separately (see Task 11), not on
        # every push.
        run: forge test -vvv --no-match-path "test/*.fork.t.sol"

      - name: Run Forge risk math fuzz suite
        run: forge test --fuzz-runs 10000 --match-path "test/ThemisRisk.t.sol"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Never log raw transactions
        # FR-013 depends on the trader always seeing the protection decision —
        # a stray console.log of a signed/raw tx is a real secret/PII leak, not style.
        run: |
          ! grep -rn "rawTransaction\|signedTx" lib app --include="*.ts" --include="*.tsx" | grep -i "console\."

      - name: No hard-coded research results
        # FR-012 / Task 12 Step 3 — every research-dashboard number must come from
        # data/economics.json or a live chain read, never a typed-in "result".
        run: |
          ! grep -rnE '"(lpNetPnl|feeRevenue|mevRecaptured)":\s*[0-9]' app components
          ! grep -rnE '"(lpNetValueWeiC0Equiv|feeRevenue[01]|fairShareRevenue[01]|effectiveTraderCostWeiC0Equiv|lvrProxyWeiC0Equiv|protectedVolumeShareBps)":\s*"?-?[0-9]' app components

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
